[package]
name = "deglitch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A saturating-counter debounce filter with a sticky latch, for no_std control code"
license = "MIT"
repository = "https://github.com/aajll/deglitch"
readme = "README.md"
keywords = ["debounce", "deglitch", "no-std", "embedded", "latch"]
categories = ["embedded", "no-std", "no-std::no-alloc"]
exclude = [".github/"]

[dependencies]

[dev-dependencies]
proptest = { version = "1.5", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
